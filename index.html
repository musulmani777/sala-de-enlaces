 finally{mineLoading=false}
}

const enRangoDisponibilidad=f=>availabilityRange&&Date.now()-availabilityRange.actualizada<180000&&f>=availabilityRange.desde&&f<=availabilityRange.hasta;
const ocupado=(f,b)=>{
 const local=RS().find(r=>r.f===f&&r.b===b&&r.est!=="cancelada"&&r.backendId);
 if(local)return local;
 return enRangoDisponibilidad(f)&&occupiedRemote.has(`${f}:${b}`)?{f,b,remote:true,est:"pendiente"}:null;
};
async function postJson(payload){
 if(USER&&USER.expiresAt&&USER.expiresAt<Date.now()+30000)throw new Error("La sesión de Google expiró. Cierra sesión e inicia nuevamente.");
 const controller=window.AbortController?new AbortController():null;
 const timer=controller?setTimeout(()=>controller.abort(),30000):null;
 try{
  const body=USER&&USER.idToken?{...payload,idToken:USER.idToken}:payload;
  const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),...(controller?{signal:controller.signal}:{})});
  const text=await response.text();
  let data;
  try{data=JSON.parse(text)}catch(e){throw new Error(`El servidor respondió con un formato no válido (HTTP ${response.status}).`)}
  if(!data||typeof data!=="object")throw new Error("El servidor respondió con datos no válidos.");
  if(!response.ok)throw new Error(mensajeApi(data.error||`Error de conexión con el servidor (HTTP ${response.status}).`));
  if(data.ok===false)throw new Error(mensajeApi(data.error||"El servidor rechazó la solicitud."));
  return data;
 }catch(e){
  if(e.name==="AbortError")throw new Error("La conexión tardó demasiado. No se reenvió la solicitud; puedes reintentar con seguridad.");
  if(e instanceof TypeError)throw new Error("No se pudo conectar con el servidor. Revisa tu conexión e inténtalo nuevamente.");
  throw e;
 }finally{if(timer)clearTimeout(timer)}
}
async function cargarDisponibilidad(desde=HOY,dias=45){
 if(availabilityRequest){
  await availabilityRequest;
  if(enRangoDisponibilidad(desde)||availabilityError)return;
 }
 availabilityLoading=true;availabilityError="";
 availabilityRequest=(async()=>{
  try{
   const data=await postJson({action:"disponibilidad",desde,dias});
   if(!Array.isArray(data.ocupados))throw new Error("La respuesta de disponibilidad no contiene bloques ocupados válidos.");
   occupiedRemote=new Set(data.ocupados.filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.f)&&Number.isInteger(Number(x.b))&&Number(x.b)>=1&&Number(x.b)<=8).map(x=>`${x.f}:${Number(x.b)}`));
   availabilityRange={desde,hasta:add(desde,dias-1),actualizada:Date.now()};
  }catch(e){availabilityError=e.message||"No se pudo consultar la disponibilidad."}
  finally{availabilityLoading=false;availabilityRequest=null}
 })();
 return availabilityRequest;
}
function ensureAvailability(fecha){
 if(enRangoDisponibilidad(fecha))return Promise.resolve();
 return cargarDisponibilidad(fecha,45);
}
async function enviarSolicitud(tipo,payload,button,errorElement,successLabel){
 const serializado=JSON.stringify({nombre:USER.nombre,...payload});
 let pendiente=pendingRequests[tipo];
 if(!pendiente||pendiente.serializado!==serializado){
  const clave=window.crypto&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
  pendiente={clave,serializado};pendingRequests[tipo]=pendiente;
 }
 const textoOriginal=button.textContent;
 const sheet=$("#sh");
 sheet.style.pointerEvents="none";
 button.disabled=true;button.textContent="Enviando…";errorElement.textContent="";
 try{
  const data=await postJson({tipo,nombre:USER.nombre,clave:pendiente.clave,...payload});
  if(data.ok!==true||data.id===undefined||data.id===null||data.id==="")throw new Error("El servidor no confirmó el envío con un ID de solicitud.");
  sheet.style.pointerEvents="";
  delete pendingRequests[tipo];
  return data;
 }catch(e){
  sheet.style.pointerEvents="";
  errorElement.textContent=e.message||"No se pudo enviar. Revisa la conexión e inténtalo nuevamente.";
  button.disabled=false;button.textContent=successLabel||textoOriginal;
  return null;
 }
}

let USER=null,ME="";
let st={logged:false,tab:"agenda",sem:0,dia:HOY};

function manejarCredencialGoogle(response){
 const aviso=$("#lerr");
 try{
  if(!response||!response.credential)throw new Error("Google no entregó una credencial válida.");
  const partes=response.credential.split(".");
  if(partes.length!==3)throw new Error("No se pudo validar la respuesta de Google.");
  const base64=partes[1].replace(/-/g,"+").replace(/_/g,"/");
  const bytes=Uint8Array.from(atob(base64.padEnd(Math.ceil(base64.length/4)*4,"=")),c=>c.charCodeAt(0));
  const perfil=JSON.parse(new TextDecoder().decode(bytes));
  const email=String(perfil.email||"").toLowerCase();
  const esCuentaInstitucional=perfil.hd===GOOGLE_DOMAIN&&email.endsWith("@"+GOOGLE_DOMAIN);
  if((!esCuentaInstitucional&&email!==GOOGLE_TEST_EMAIL)||perfil.email_verified!==true)
   throw new Error("Usa una cuenta Google incluida en la lista autorizada.");
  const expiresAt=Number(perfil.exp)*1000;
  if(!Number.isFinite(expiresAt)||expiresAt<=Date.now())throw new Error("La sesión de Google ya venció. Inténtalo otra vez.");
  USER={email,nombre:nombreNormalizado(perfil.name||email),idToken:response.credential,expiresAt};
  ME=email;st.logged=true;st.tab="agenda";fm={};
  render();
  const tareas=[cargarDisponibilidad(HOY),cargarMisReservas()];
  if(esAdmin())tareas.push(cargarReservasAdmin());
  Promise.all(tareas).then(()=>{if(st.logged)render()});
 }catch(error){if(aviso)aviso.textContent=error.message||"No se pudo iniciar sesión con Google."}
}
function prepararGoogleLogin(){
 const aviso=$("#lerr");
 if(!$("#googleSignIn"))return;
 if(!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID.indexOf("PEGA_AQUI")===0){
  aviso.textContent="Falta configurar el cliente de inicio de sesión Google para publicar esta versión.";
  return;
 }
 const listo=()=>{
  const botonActual=$("#googleSignIn"),avisoActual=$("#lerr");
  if(!botonActual)return;
  if(!window.google||!google.accounts||!google.accounts.id){if(avisoActual)avisoActual.textContent="No se pudo cargar el inicio de sesión Google. Revisa tu conexión e inténtalo otra vez.";return}
  if(!googleIdInitialized){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:manejarCredencialGoogle,auto_select:false});googleIdInitialized=true}
  google.accounts.id.renderButton(botonActual,{theme:"filled_blue",size:"large",shape:"pill",text:"signin_with",width:Math.min(320,botonActual.clientWidth||280)});
 };
 if(window.google&&google.accounts&&google.accounts.id){listo();return}
 let script=$("#google-identity");
 if(script){
  if(script.dataset.failed==="true")aviso.textContent="No se pudo cargar el inicio de sesión Google. Revisa tu conexión.";
  else if(!script.dataset.waiting){script.dataset.waiting="true";script.addEventListener("load",listo,{once:true})}
  return;
 }
 script=document.createElement("script");script.id="google-identity";script.src="https://accounts.google.com/gsi/client";script.async=true;
 script.onload=listo;script.onerror=()=>{script.dataset.failed="true";const actual=$("#lerr");if(actual)actual.textContent="No se pudo cargar el inicio de sesión Google. Revisa tu conexión.";};
 document.head.appendChild(script);
}

function render(){
 if(!st.logged)return vLogin();
 if(st.tab==="admin"&&!esAdmin())st.tab="agenda";
 shell(st.tab==="agenda"?vAgenda():st.tab==="horario"?vHorario():st.tab==="mis"?vMis():st.tab==="admin"?vAdmin():st.tab==="fallas"?vFallas():vAgenda());

/* ═════════ EVENTOS ═════════ */
document.addEventListener("click",async e=>{
 if(e.target.id==="ov")return cerrar();
 const t=e.target.closest("button");if(!t)return;const d=t.dataset,id=t.id;
 if("font" in d){ajustarTexto(+d.font);return}
 if(id==="out"){if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();st.logged=false;USER=null;ME="";fm={};cerrar();render()}
 else if(id==="retryAvailability"){const f=fm.f||st.dia,request=cargarDisponibilidad(f);if($("#ov").classList.contains("hidden"))render();else sheetRes();await request;if($("#ov").classList.contains("hidden"))render();else sheetRes()}
 else if(d.t){
  if(d.t==="admin"&&!esAdmin())return;
  st.tab=d.t;fm={};if(d.t==="fallas")fm.incidencias=[{}];
  const carga=d.t==="mis"?cargarMisReservas():d.t==="admin"?cargarReservasAdmin():null;
  render();scrollTo(0,0);if(carga)carga.then(()=>{if(st.tab===d.t)render()});
 }
 else if(id==="refreshMine"){const carga=cargarMisReservas();render();await carga;render()}
 else if(id==="refreshAdmin"){const carga=cargarReservasAdmin();render();await carga;render()}
 else if(d.adminestado){if(!esAdmin())return;await cambiarEstadoReserva(d.adminid,d.adminestado)}
 else if(d.dia){st.dia=d.dia;const request=ensureAvailability(st.dia);render();request.then(()=>{if(st.tab==="agenda")render()})}
 else if(d.sem){st.sem+=+d.sem;st.dia=add(lunes0,st.sem*7);if(st.sem===0&&esHabil(HOY))st.dia=HOY;const request=ensureAvailability(st.dia);render();request.then(()=>{if(st.tab==="agenda")render()})}
 else if(d.res)abrirRes(+d.res);
 else if(id==="fab")abrirRes();
 else if("x" in d)cerrar();
 else if(d.fsem){guardaCampos();fm.sem+=+d.fsem;sheetRes()}
 else if(d.fd){guardaCampos();fm.f=d.fd;if(fm.f>=MIN)fm.esp=false;if(fm.b&&(ocupado(fm.f,fm.b)||bloquePasado(fm.f,fm.b-1)))fm.b=null;const request=ensureAvailability(fm.f);sheetRes();request.then(()=>{if(!$("#ov").classList.contains("hidden")&&fm.f===d.fd)sheetRes()})}
 else if(d.fb){guardaCampos();fm.b=+d.fb;sheetRes()}
 else if(d.pc){guardaCampos();fm.pcs=Math.min(30,Math.max(1,fm.pcs+ +d.pc));sheetRes()}
 else if("espon" in d){guardaCampos();fm.esp=true;sheetRes()}
 else if("addinc" in d){guardarIncidenciasReporte();if((fm.incidencias||[]).length<10)fm.incidencias.push({});render()}
 else if(d.delinc!==undefined){guardarIncidenciasReporte();fm.incidencias.splice(+d.delinc,1);if(!fm.incidencias.length)fm.incidencias.push({});render()}
 else if(d.tp){
  if(d.fidx!==undefined){guardarIncidenciasReporte();const i=+d.fidx,row=fm.incidencias[i];row.tipo=row.tipo===d.tp?null:d.tp;render()}
  else{fm.tipo=fm.tipo===d.tp?null:d.tp;t.parentElement.querySelectorAll("button").forEach(x=>{ON.trim().split(" ").forEach(c=>x.classList.remove(c));x.setAttribute("aria-pressed","false")});if(fm.tipo){ON.trim().split(" ").forEach(c=>t.classList.add(c));t.setAttribute("aria-pressed","true")}}
 }
 else if(d.ord){fm.ord=d.ord==="true";guardaCampos();sheetCierre()}
 else if(d.cierre){fm={r:RS().find(x=>x.id==d.cierre),ord:null,falla:false,tipo:null};sheetCierre();abrirSheet()}
 else if(id==="sendF"){
  guardarIncidenciasReporte();
  const rows=fm.incidencias||[],incidencias=[];
  if(!rows.length)return $("#ferr").textContent="Agrega al menos una incidencia.";
  for(let i=0;i<rows.length;i++){
   const f=leerFalla("ff",i);
   if(!Number.isInteger(f.equipo_numero)||f.equipo_numero<1||f.equipo_numero>40)return $("#ferr").textContent=`El número de equipo de la incidencia ${i+1} debe estar entre 1 y 40.`;
   if(!f.detalle)return $("#ferr").textContent=`Completa el detalle de la incidencia ${i+1}.`;
   incidencias.push(f);
  }
  const data=await enviarSolicitud("FALLA",{observacion:(fm.obsF||"").trim(),incidencias},t,$("#ferr"),"Enviar reporte");
  if(!data)return;
  lastRequestId=data.id;fm={};render();confirma("Falla reportada","Solicitud enviada correctamente.",lastRequestId);
 }
 else if("env" in d){
  guardaCampos();const err=$("#err"),curso=(fm.curso||"").trim(),asig=(fm.asig||"").trim();
  if(!esHabil(fm.f))return err.textContent="Elige un día hábil.";
  if(!fm.b)return err.textContent="Elige un bloque.";
  if(!Number.isInteger(fm.pcs)||fm.pcs<1||fm.pcs>30)return err.textContent="La cantidad de computadores debe estar entre 1 y 30.";
  if(!curso||!asig)return err.textContent="Completa curso y asignatura.";
  if(!enRangoDisponibilidad(fm.f)){err.textContent=availabilityError||"Confirma la disponibilidad antes de enviar.";const request=ensureAvailability(fm.f);request.then(()=>{if(!$("#ov").classList.contains("hidden"))sheetRes()});return}
  if(ocupado(fm.f,fm.b)||bloquePasado(fm.f,fm.b-1))return err.textContent="Ese bloque ya no está disponible.";
  if(fm.f<MIN&&!fm.esp)return err.textContent=`La fecha debe cumplir ${PLAZO} días hábiles de anticipación (desde el ${fLarga(MIN)}) o solicitar una excepción.`;
  const just=(fm.just||"").trim();
  if(fm.esp&&just.length<15)return err.textContent="Explica el motivo de la solicitud especial (mínimo 15 caracteres).";
  const inc=[];if(fm.falla){const f=leerFalla("rf");if(!Number.isInteger(f.equipo_numero)||f.equipo_numero<1||f.equipo_numero>40||!f.detalle)return err.textContent="Completa el número de equipo (1–40) y el detalle de la falla, o desmarca la falla.";inc.push(f)}
  const esp=!!fm.esp;
  const p={fecha:fm.f,bloque:fm.b,pcs:fm.pcs,curso,asignatura:asig,casoEspecial:esp,justificacion:esp?just:"",observacion:(fm.obs||"").trim(),incidencias:inc};
  const data=await enviarSolicitud("RESERVA",p,t,err,esp?"Enviar solicitud especial":"Solicitar reserva");
  if(!data)return;
  const reserva={id:++DB.id,backendId:data.id,f:fm.f,b:fm.b,doc:USER.nombre,e:ME,curso,asig,pcs:fm.pcs,est:"pendiente",cierre:false,esp,just:esp?just:""};
  RS().push(reserva);const guardadaLocalmente=guardar();occupiedRemote.add(`${fm.f}:${fm.b}`);lastRequestId=data.id;
  const especial=esp;
  st.dia=fm.f;st.sem=semDe(fm.f);fm={};render();
  confirma(especial?"Solicitud especial enviada":"Solicitud enviada",`Solicitud enviada correctamente.${data.plazo?` Plazo: ${esc(data.plazo)}.`:""}${guardadaLocalmente?"":" El servidor la recibió, pero no se pudo guardar en este teléfono. Anota el ID de solicitud."}`,lastRequestId);
 }
 else if("envc" in d){
  guardaCampos();const err=$("#err");
  if(fm.ord===null)return err.textContent="Indica cómo quedó la sala.";
  const r=fm.r,estadoAnterior=r.est,cierreAnterior=r.cierre,datosAnteriores=r.cierreDatos;
  r.cierre=true;r.est="completada";r.cierreDatos={ordenada:fm.ord,observacion:(fm.obs||"").trim()};
  if(!guardar()){r.est=estadoAnterior;r.cierre=cierreAnterior;r.cierreDatos=datosAnteriores;return err.textContent="No se pudo guardar el cierre en este teléfono. Libera espacio y vuelve a intentarlo."}
  fm={};render();confirma("Cierre guardado","Se guardó en este teléfono; no se envió al Encargado.");
 }
});
document.addEventListener("change",e=>{
 if(e.target.id==="chF"){guardaCampos();fm.falla=e.target.checked;fm.tipo=null;fm.r?sheetCierre():sheetRes()}
 else if(e.target.id==="chE"){guardaCampos();fm.esp=e.target.checked;sheetRes()}
});
setInterval(async()=>{
 if(document.hidden||!st.logged)return;
 if(st.tab==="mis"){await cargarMisReservas();if(st.logged&&st.tab==="mis")render()}
 else if(st.tab==="admin"&&esAdmin()){await cargarReservasAdmin();if(st.logged&&st.tab==="admin")render()}
},60000);

/* ═════════ Instalación PWA ═════════ */
let dip=null,instOculto=false;
try{instOculto=sessionStorage.getItem("se_inst_x")==="1"}catch(e){}
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e});
addEventListener("appinstalled",()=>{dip=null;render();toast("App instalada ✅")});
function instBtn(x){return standalone()?"":`<div class="flex items-stretch gap-2"><button id="inst" class="flex-1 rounded-2xl bg-emerald-500 px-4 py-4 text-base font-bold text-white shadow-lg ring-2 ring-white/40">📱 Descargar / Instalar App</button>${x?`<button id="instX" aria-label="Ocultar" class="px-2 text-2xl text-slate-400">×</button>`:""}</div>`}
function instBanner(){return instOculto||standalone()?"":`<div class="mb-3">${instBtn(true)}</div>`}
function guiaInstalar(){
 const pasos=isIOS?["Abre este enlace en <b>Safari</b>.","Toca <b>Compartir</b> ⬆️ (barra de abajo; en iPad, arriba).","Baja y toca <b>Añadir a pantalla de inicio</b>.","Toca <b>Añadir</b>. Listo."]
 :["Abre este enlace en <b>Chrome</b>.","Toca el menú <b>⋮</b> (arriba a la derecha).","Elige <b>Instalar aplicación</b> (o <b>Añadir a pantalla de inicio</b>).","Toca <b>Instalar</b>. Listo."];
 $("#sh").innerHTML=`${grip}
 <div class="mb-3 flex items-center justify-between"><h2 class="text-lg font-semibold">${isIOS?"Instalar en iPhone":"Instalar en Android"}</h2><button data-x aria-label="Cerrar" class="text-2xl leading-none text-slate-500">×</button></div>
 <ol class="mb-4 list-decimal space-y-2 pl-5 text-base">${pasos.map(p=>`<li>${p}</li>`).join("")}</ol>
 <p class="mb-3 text-xs text-slate-500">${isIOS?"En iPhone el sistema no permite instalar con un solo botón: hay que hacerlo desde Compartir.":"Si no aparece la opción, abre el enlace https en Chrome (no dentro de WhatsApp u otra app)."}</p>
 <button data-x class="w-full rounded-2xl bg-indigo-600 py-3.5 text-base font-semibold text-white">Entendido</button>`;
 abrirSheet();
}
document.addEventListener("click",async e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.id==="inst"){if(dip){const d=dip;dip=null;d.prompt();const r=await d.userChoice;if(r.outcome==="accepted")toast("Instalando…")}else guiaInstalar()}
 else if(t.id==="instX"){instOculto=true;try{sessionStorage.setItem("se_inst_x","1")}catch(x){}render()}
});
/* Service Worker opcional: si subes un sw.js junto a este archivo se activa el modo sin internet; si no, la app se instala igual. */
if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

const bootScreen=$("#boot-screen");
document.body.classList.add("booting");
function finishBoot(){
 if(!bootScreen||bootScreen.dataset.done)return;
 bootScreen.dataset.done="1";
 $("#app").removeAttribute("aria-hidden");
 document.body.classList.remove("booting");
 bootScreen.classList.add("boot-out");
 setTimeout(()=>bootScreen.remove(),500);
}
$("#boot-skip").addEventListener("click",finishBoot);
setTimeout(finishBoot,matchMedia("(prefers-reduced-motion: reduce)").matches?150:3100);

render();
if(st.logged){const request=cargarDisponibilidad(HOY);render();request.then(()=>{if(st.logged)render()})}
</script>
</body>
</html>
